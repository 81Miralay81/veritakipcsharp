name: Windows single-file EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore MiralayIFSExplorer.csproj
      - name: Smoke checks
        run: dotnet run --project MiralayIFSExplorer.csproj -c Release --no-restore -- --self-test
      - name: Publish one self-contained EXE
        run: dotnet publish MiralayIFSExplorer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts
      - name: Verify artifact contains only the EXE
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts -File
          if ($files.Count -ne 1 -or $files[0].Extension -ne ".exe") {
            throw "Expected one EXE only. Found: $($files.Name -join ', ')"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Veri-Takip-Windows-EXE
          path: artifacts/VeriTakip.exe
          if-no-files-found: error
          compression-level: 0
